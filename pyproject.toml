[project]
name = "django-ninja-expose"
version = "0.1.1"
description = "Add @expose() to a Django model. Get a REST API, powered by Django Ninja."
readme = "README.md"
authors = [
    { name = "Benjamin Chau", email = "68836494+swarfte@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-ninja>=1.7.3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
